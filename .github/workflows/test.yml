name: test

# Every push to main and every pull request: formatting, vet and the full
# test suite (shuffled arrival orders, a process killed and resumed, a
# Python producer) on Linux, macOS and Windows, the race detector on Linux,
# the release plan's cases, and the smoke check on a binary built as the
# release builds it. A passing run on main starts the release workflow,
# which releases a raised version.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - if: runner.os == 'Linux'
        run: go test -race -short -count=1 ./...
      - if: runner.os != 'Windows'
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'
      - name: Smoke check on a release-style binary
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir bin
          go build -trimpath -ldflags '-s -w' -o "bin/inorderly$(go env GOEXE)" ./cmd/inorderly
          if [ "$RUNNER_OS" = Windows ]; then python scripts/smoke.py bin; else python3 scripts/smoke.py bin; fi

  # The broker clients against real servers: Redis and Valkey, NATS with
  # JetStream and Kafka in KRaft mode, the official images, started fresh.
  # Failing test lines are repeated as annotations, which can be read
  # without the job log.
  brokers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Start the servers
        run: |
          docker run -d --name redis -p 6379:6379 redis:8
          docker run -d --name valkey -p 6380:6379 valkey/valkey:9
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.12 -js -m 8222 -DV
          docker run -d --name kafka -p 9092:9092 apache/kafka:4.1.0
          for i in $(seq 1 90); do
            ok=0
            docker exec redis redis-cli ping >/dev/null 2>&1 && ok=$((ok+1))
            docker exec valkey valkey-cli ping >/dev/null 2>&1 && ok=$((ok+1))
            curl -sf 'http://localhost:8222/healthz?js-enabled-only=true' >/dev/null && ok=$((ok+1))
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && ok=$((ok+1))
            [ $ok = 4 ] && exit 0
            sleep 2
          done
          docker ps -a
          echo "::error::the brokers didn't start"
          exit 1
      - name: Broker tests
        shell: bash
        run: |
          set -o pipefail
          run() {
            go test -count=1 -v ./internal/broker/ ./cmd/inorderly/ -run "$1" 2>&1 | tee -a broker-test.log
          }
          status=0
          INORDERLY_TEST_REDIS=localhost:6379 INORDERLY_TEST_NATS=localhost:4222 INORDERLY_TEST_KAFKA=localhost:9092 run 'Test' || status=1
          INORDERLY_TEST_REDIS=localhost:6380 run 'Broker' || status=1
          grep -E '^\s+[a-z_]+_test\.go:[0-9]+:|--- FAIL|^panic|^FAIL' broker-test.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          grep -E 'kills,' broker-test.log | while IFS= read -r l; do echo "::notice::${l}"; done
          exit $status
      - name: NATS trace when the tests fail
        if: failure()
        shell: bash
        run: |
          docker logs nats 2>&1 | grep -E 'CONSUMER|MSG.NEXT|JS.ACK|HMSG|\[ERR\]|\[WRN\]|consumer_create|-ERR' | grep -v 'Temporary storage' > nats-all.txt || true
          { head -70 nats-all.txt; echo ...; tail -50 nats-all.txt; } > nats-trace.txt
          for part in 0 1 2 3 4 5; do
            chunk=$(sed -n "$((part*20+1)),$((part*20+20))p" nats-trace.txt | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            [ -n "$chunk" ] && echo "::warning title=nats trace ${part}::${chunk}"
          done
          true
