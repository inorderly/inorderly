name: test

# Every push to main and every pull request: formatting, vet and the full
# test suite (shuffled arrival orders, a process killed and resumed, a
# Python producer) on Linux, macOS and Windows, the race detector on Linux,
# the release plan's cases, and the smoke check on a binary built as the
# release builds it. A passing run on main starts the release workflow,
# which releases a raised version.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - if: runner.os == 'Linux'
        run: go test -race -short -count=1 ./...
      - if: runner.os != 'Windows'
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'
      - name: Smoke check on a release-style binary
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir bin
          go build -trimpath -ldflags '-s -w' -o "bin/inorderly$(go env GOEXE)" ./cmd/inorderly
          if [ "$RUNNER_OS" = Windows ]; then python scripts/smoke.py bin; else python3 scripts/smoke.py bin; fi
